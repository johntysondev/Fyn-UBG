<main id="app-main">
<div class="grid-mesh-bg"></div>
<div id="hero-home-view" class="hero-home-view">
<div class="brand-section">
<h1 id="brand-logo-interactive" class="brand-logo-text" title="fyn ubg"><span class="fyn-word">fyn</span> <span class="ubg-tag-word">ubg</span></h1>
</div>
<div class="center-search-wrap">
<input id="center-search-input" class="center-search-input" type="text" placeholder="search or enter a game..." autocomplete="off">
<button id="center-go-btn" class="center-go-btn"><span>Go</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
</div>
</div>
<div id="catalog-view" class="catalog-view hidden">
<div class="catalog-header">
<div class="catalog-title-wrap">
<h2 id="catalog-section-title">Games</h2>
<span id="catalog-count-badge" class="catalog-count-badge">500+ games</span>
</div>
<div class="catalog-search-wrap">
<input id="catalog-search-input" class="catalog-search-input" type="text" placeholder="Search games..." autocomplete="off">
</div>
</div>
<div id="games-grid" class="games-grid"></div>
</div>
<div id="settings-view" class="settings-view hidden">
<div class="settings-header">
<h2>Settings</h2>
</div>
<div class="setting-group">
<label class="setting-label">Theme</label>
<div id="theme-selector-grid" class="theme-selector-grid">
<button data-theme="dark" class="theme-card active"><strong><span class="theme-swatch" style="background:#000000;"></span>Dark</strong></button>
<button data-theme="light" class="theme-card"><strong><span class="theme-swatch" style="background:#f4f4f4;"></span>Light</strong></button>
<button data-theme="slate" class="theme-card"><strong><span class="theme-swatch" style="background:#23262e;"></span>Slate</strong></button>
<button data-theme="navy" class="theme-card"><strong><span class="theme-swatch" style="background:#141c34;"></span>Navy</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Font</label>
<div id="font-selector-grid" class="font-selector-grid">
<button data-font="clean" class="font-card active"><strong style="font-family:'Inter', sans-serif;">Clean</strong></button>
<button data-font="mono" class="font-card"><strong style="font-family:'JetBrains Mono', monospace;">Mono</strong></button>
<button data-font="serif" class="font-card"><strong style="font-family:Georgia, serif;">Serif</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Tab Cloak</label>
<div id="cloak-presets" class="cloak-grid">
<button data-preset="quizlet" class="cloak-card active"><img src="icons-4-tab-cloak/quizlet.png" alt="Quizlet" width="18" height="18"><div><strong>Your Sets | Quizlet</strong></div></button>
<button data-preset="classroom" class="cloak-card"><img src="icons-4-tab-cloak/Google Classroom.ico" alt="Google Classroom" width="18" height="18"><div><strong>Classes | Google Classroom</strong></div></button>
<button data-preset="drive" class="cloak-card"><img src="icons-4-tab-cloak/Google Drive.ico" alt="Google Drive" width="18" height="18"><div><strong>My Drive - Google Drive</strong></div></button>
<button data-preset="desmos" class="cloak-card"><img src="icons-4-tab-cloak/desmos.ico" alt="Desmos" width="18" height="18"><div><strong>Desmos | Graphing Calculator</strong></div></button>
<button data-preset="canvas" class="cloak-card"><img src="icons-4-tab-cloak/canvas-lms.png" alt="Canvas LMS" width="18" height="18"><div><strong>Dashboard | Canvas LMS</strong></div></button>
<button data-preset="docs" class="cloak-card"><img src="icons-4-tab-cloak/icons8-google-docs-16.png" alt="Google Docs" width="18" height="18"><div><strong>Algebra II Notes - Google Docs</strong></div></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Game Launch Mode</label>
<div id="launch-selector-grid" class="theme-selector-grid">
<button data-launch="player" class="theme-card active"><strong>In-app player</strong></button>
<button data-launch="tab" class="theme-card"><strong>New tab</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Home Search</label>
<div id="searchmode-selector-grid" class="theme-selector-grid">
<button data-searchmode="games" class="theme-card active"><strong>Search games</strong></button>
<button data-searchmode="google" class="theme-card"><strong>Google it</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Card Size</label>
<div id="density-selector-grid" class="theme-selector-grid">
<button data-density="normal" class="theme-card active"><strong>Normal</strong></button>
<button data-density="compact" class="theme-card"><strong>Compact</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Animations</label>
<div id="motion-selector-grid" class="theme-selector-grid">
<button data-motion="on" class="theme-card active"><strong>On</strong></button>
<button data-motion="off" class="theme-card"><strong>Off</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Layout</label>
<div id="layout-selector-grid" class="theme-selector-grid">
<button data-layout="side" class="theme-card active"><strong>Sidebar</strong></button>
<button data-layout="browser" class="theme-card"><strong>Browser</strong></button>
</div>
</div>
<div class="setting-group">
<label class="setting-label">Emergency panic key & destination</label>
<div style="display:flex; gap:10px;">
<input id="panic-key-input" type="text" style="width:60px; text-align:center; font-weight:bold;" maxlength="1" value="]">
<input id="panic-url-input" type="text" style="flex:1;" value="https://classroom.google.com">
</div>
</div>
<div class="setting-group" style="flex-direction:row; align-items:center; gap:10px;">
<input id="anti-close-checkbox" type="checkbox" style="width:16px; height:16px; accent-color:#fff;">
<label class="setting-label" for="anti-close-checkbox" style="cursor:pointer;">stop accidental tab closing</label>
</div>
<div class="settings-actions">
<button id="reset-settings-btn" class="btn-ghost">Reset Defaults</button>
<button id="save-settings-btn" class="btn-action">Save Settings</button>
</div>
<div class="setting-group">
<label class="setting-label">Credits</label>
<div class="credits-list">
<div class="credit-card">
<span class="credit-avatar">T</span>
<div class="credit-meta">
<strong><a href="https://truffled.lol/" target="_blank" rel="noopener">truffled</a></strong>
</div>
</div>
<div class="credit-card">
<span class="credit-avatar">K</span>
<div class="credit-meta">
<strong><a href="https://korona.lat/" target="_blank" rel="noopener">korona</a></strong>
<div class="credit-tags"><span class="credit-tag">Inspiration</span></div>
</div>
</div>
</div>
</div>
</div>
</main>
<div id="game-player-view" class="player-overlay hidden">
<div class="player-topbar">
<div class="player-info">
<button id="player-back-btn" class="player-back-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</button>
<h3 id="player-game-title" class="player-title">Game</h3>
</div>
<div class="player-controls">
<button id="player-reload-btn" class="player-btn">Reload</button>
<button id="player-newtab-btn" class="player-btn">New Tab</button>
<button id="player-fullscreen-btn" class="player-btn">Fullscreen</button>
</div>
</div>
<div class="player-stage-wrap">
<div id="player-loading" class="player-loading hidden">Loading...</div>
<div id="player-blocked" class="player-blocked hidden">
<p><strong>The game isn't loading.</strong></p>
<p>Your wifi might be blocking the game files, try reloading the tab, or open it in a new tab.</p>
<div class="player-blocked-actions">
<button id="player-blocked-reload" class="btn-action">Reload</button>
<button id="player-blocked-newtab" class="btn-ghost">Open in new tab</button>
<button id="player-blocked-dismiss" class="btn-ghost">Dismiss</button>
</div>
</div>
<div id="player-container" class="player-container"></div>
</div>
</div>
<div id="layout-chooser" class="chooser-overlay hidden">
<div class="chooser-card">
<div class="chooser-top">
<span class="chooser-brand">fyn ubg</span>
<span class="chooser-step">1 / 1</span>
</div>
<div class="chooser-progress"><span></span></div>
<h2>Choose your look.</h2>
<p>You can switch this in settings at any time.</p>
<div class="chooser-grid">
<button data-layout-pick="side" class="pick-card selected">
<span class="pick-check">✓</span>
<span class="pick-art">
<span class="pa-rail"><i></i><i></i><i></i><i></i></span>
<span class="pa-main"><span class="pa-pill"></span><span class="pa-tiles"><i></i><i></i></span></span>
</span>
<strong>Sidebar</strong>
<small>classic sidebar like truffled</small>
</button>
<button data-layout-pick="browser" class="pick-card">
<span class="pick-check">✓</span>
<span class="pick-art">
<span class="pa-browser"><span class="pa-dots"><i></i><i></i><i></i></span><span class="pa-addr"></span></span>
<span class="pa-tiles3"><i></i><i></i><i></i></span>
</span>
<strong>Browser</strong>
<small>normal browser look with tabs</small>
</button>
</div>
<div class="chooser-foot">
<button id="layout-back-btn" class="btn-ghost" disabled>← Back</button>
<button id="layout-next-btn" class="btn-action">Next →</button>
</div>
</div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="js/games-data.js"></script>
<script src="js/app.js"></script>
